{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Vizin{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/administrador/painel.css' %}">
</head>
<body>
  <header class="feed-header" style="max-width:900px;margin:20px auto;">
    <div class="user-mini-info">
      <div class="mini-avatar"></div>
      <div class="user-details">
        <div class="user-name">{{ request.user.get_full_name|default:request.user.email }}</div>
        <div class="user-address">Administrador</div>
      </div>
    </div>
    <div class="header-logo">Vizin</div>
    <nav>
      <a href="{% url 'administrador:lista_funcionarios' %}" class="nav-item" style="color:var(--roxo-vizin);">Funcionários</a>
    </nav>
  </header>

  <main style="display:flex;justify-content:center;">
    <div style="width:100%;max-width:900px;padding:0 16px;">
      {% if messages %}
        <div style="margin-bottom:16px;">
          {% for message in messages %}
            <div class="post-card" style="background:#eaf3ff;color:#063;">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
