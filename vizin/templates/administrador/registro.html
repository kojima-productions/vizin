<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Cadastro de Administrador</title>
</head>
<body>
  <h1>Cadastro de Administrador</h1>

  {% if form.non_field_errors %}
    <div style="color:red">{{ form.non_field_errors }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <button type="submit">Cadastrar</button>
  </form>

  <p>Já tem conta? <a href="{% url 'administrador:login' %}">Entrar</a></p>
</body>
</html>
