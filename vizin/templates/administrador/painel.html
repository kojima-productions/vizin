{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Vizin{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="feed-header" style="max-width:900px;margin:20px auto;">
    <a href="/administrador/painel" class="user-mini-link" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
      <div class="mini-avatar"></div>
      <div class="user-details">
        <div class="user-name"><span class="admin-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/></svg></span>{{ request.user.get_full_name|default:request.user.email }}</div>
        <div class="user-address">Administrador</div>
      </div>
    </a>
    <div class="header-logo">Vizin</div>
  </header>

  <main style="display:flex;justify-content:center;">
    <div style="width:100%;max-width:900px;padding:0 16px;">
      <div class="profile-actions" style="margin-bottom:20px;">
        <a href="{% url 'administrador:lista_funcionarios' %}" class="btn-redefinir">
          <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5zM19 21v-1c0-2.761-2.239-5-5-5H10c-2.761 0-5 2.239-5 5v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Funcionários
        </a>
	<a href="{% url 'administrador:lista_moradores' %}" class="btn-redefinir">
          <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17 21v-2a4 4 0 0 0-4-4H11a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Moradores
        </a>
        <a href="{% url 'administrador:lista_areas' %}" class="btn-redefinir">
          <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7M4 21V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Áreas Comuns
        </a>
        <a href="{% url 'administrador:lista_reservas' %}" class="btn-redefinir">
          <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Gerenciar Reservas
        </a>
      </div>
      {% if messages %}
        <div style="margin-bottom:16px;">
          {% for message in messages %}
            <div class="post-card" style="background:#eaf3ff;color:#063;">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

    </div>
  </main>

</body>
</html>
