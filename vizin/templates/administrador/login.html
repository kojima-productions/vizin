{% load socialaccount %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Login Administrador</title>
</head>
<body>
  <h1>Login Administrador</h1>

  {% if form.non_field_errors %}
    <div style="color:red">{{ form.non_field_errors }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <button type="submit">Entrar</button>
  </form>

  <p>Ou</p>
  <p><a href="{% provider_login_url 'google' %}">Entrar com Google</a></p>

  <p>Ainda não tem conta? <a href="{% url 'administrador:registro' %}">Cadastre-se</a></p>
</body>
</html>
